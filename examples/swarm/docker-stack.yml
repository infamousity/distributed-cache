version: '3.9'

services:
  app:
    image: ${IMAGE:-distributed-cache-example-app:latest}
    networks:
      - cache_control
    deploy:
      mode: replicated
      replicas: 3
      placement:
        max_replicas_per_node: 1
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.platform.os == linux}
    environment:
      # Swarm task metadata gives each cache node a stable per-task identity and
      # lets the app derive tasks.<service> DNS for peer discovery.
      CACHE_RUNTIME: swarm
      CACHE_SWARM_SERVICE_NAME: "{{.Service.Name}}"
      CACHE_NODE_NAME: "{{.Task.Name}}"
      # Harness HTTP is example-only and stays on the private overlay.
      CACHE_HARNESS_HTTP_BIND_ADDR: ":8080"
      # Bind addresses are listener addresses inside the container. The app
      # derives peer-reachable advertise IPs from tasks.<service> DNS in this
      # one-overlay example. If the service joins multiple overlays, set
      # CACHE_CLUSTER_MEMBERLIST_PEER_NETWORK_CIDRS to the cache overlay CIDR.
      CACHE_CONTROL_BIND_ADDR: "0.0.0.0"
      CACHE_CONTROL_BIND_PORT: 9090
      CACHE_GOSSIP_BIND_ADDR: "0.0.0.0"
      CACHE_GOSSIP_BIND_PORT: 8946
      # Peer DNS port is the fixed container gossip port used for memberlist.
      CACHE_PEER_DNS_PORT: 8946
      CACHE_CLUSTER_MEMBERLIST_PEER_NETWORK_CIDRS: "${CACHE_CLUSTER_MEMBERLIST_PEER_NETWORK_CIDRS:-}"
      # Development-only key. Production deployments should inject a generated
      # secret and use the same value on every cache node.
      CACHE_SHARED_KEY: dev-shared-key
      CACHE_TOMBSTONE_TTL_MS: 300000
      CACHE_VALUE_TTL_MS: 600000
      CACHE_WRITE_CONCERN: "${CACHE_WRITE_CONCERN:-majority}"
      CACHE_STARTUP_WAIT_MS: 5000
      # Three replicas means each node expects both other peers before it is
      # considered ready.
      CACHE_DIAGNOSTICS_MIN_READY_PEERS: 2

  harness:
    image: ${IMAGE:-distributed-cache-example-app:latest}
    networks:
      - cache_control
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.platform.os == linux}

networks:
  cache_control:
    driver: overlay
    attachable: false
    internal: true
    driver_opts:
      encrypted: "true"
