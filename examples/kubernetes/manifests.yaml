apiVersion: v1
kind: Secret
metadata:
  name: cache-shared-key
type: Opaque
stringData:
  # Replace this development placeholder. Every cache pod in the cluster must
  # use the same shared key.
  shared-key: replace-with-a-long-random-shared-key
---
apiVersion: v1
kind: Service
metadata:
  name: cache-peers
  labels:
    app.kubernetes.io/name: distributed-cache-example
spec:
  # Headless Service DNS returns individual pod IPs. Memberlist needs pod-level
  # peer discovery, not a load-balanced ClusterIP.
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: distributed-cache-example
  ports:
    - name: gossip-tcp
      port: 8946
      targetPort: gossip-tcp
      protocol: TCP
    - name: gossip-udp
      port: 8946
      targetPort: gossip-udp
      protocol: UDP
    - name: control
      port: 9090
      targetPort: control
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: distributed-cache-example
  labels:
    app.kubernetes.io/name: distributed-cache-example
spec:
  serviceName: cache-peers
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: distributed-cache-example
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-cache-example
    spec:
      containers:
        - name: app
          image: registry.example.com/your-cache-embedded-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: gossip-tcp
              containerPort: 8946
              protocol: TCP
            - name: gossip-udp
              containerPort: 8946
              protocol: UDP
            - name: control
              containerPort: 9090
              protocol: TCP
          env:
            # Pod name is a stable node identity for this StatefulSet member.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Pod IP is the memberlist advertise address. Memberlist requires an
            # IP advertise address; do not use the headless Service DNS name
            # here.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CACHE_CLUSTER_MEMBERLIST_NODE_NAME
              value: "$(POD_NAME)"
            # Bind addresses are listener addresses inside the pod.
            - name: CACHE_CLUSTER_MEMBERLIST_BIND_ADDRESS
              value: "0.0.0.0"
            - name: CACHE_CLUSTER_MEMBERLIST_BIND_PORT
              value: "8946"
            # Advertise addresses are what peer pods dial.
            - name: CACHE_CLUSTER_MEMBERLIST_ADVERTISE_ADDRESS
              value: "$(POD_IP)"
            - name: CACHE_CLUSTER_MEMBERLIST_ADVERTISE_PORT
              value: "8946"
            # Peer discovery uses headless Service DNS plus the fixed gossip
            # container port.
            - name: CACHE_CLUSTER_MEMBERLIST_PEER_DNS_NAME
              value: "cache-peers.default.svc.cluster.local"
            - name: CACHE_CLUSTER_MEMBERLIST_PEER_DNS_PORT
              value: "8946"
            - name: CACHE_API_BIND_ADDR
              value: "0.0.0.0"
            - name: CACHE_API_BIND_PORT
              value: "9090"
            # The control plane can advertise a pod IP:port or a stable pod DNS
            # name:port, as long as peer pods can dial it.
            - name: CACHE_CONTROL_ADVERTISE_ADDR
              value: "$(POD_IP):9090"
            - name: CACHE_SHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: cache-shared-key
                  key: shared-key
            - name: CACHE_DIAGNOSTICS_MIN_READY_PEERS
              value: "2"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: distributed-cache-private-peers
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: distributed-cache-example
  policyTypes:
    - Ingress
  ingress:
    # Only same-app pods may reach the cache internals. Expose any product API
    # through a separate Service owned by the host application.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: distributed-cache-example
      ports:
        - port: 8946
          protocol: TCP
        - port: 8946
          protocol: UDP
        - port: 9090
          protocol: TCP
