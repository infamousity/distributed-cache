# peerDNSName, peerIP, and peerAddr are config-template functions evaluated by
# the repository config loader. They are not YAML fields, env vars, or
# cache.Options members.
# - peerDNSName resolves explicit peer DNS env or derives tasks.<service> from
#   CACHE_RUNTIME=swarm and CACHE_SWARM_SERVICE_NAME. For multi-stack peer
#   discovery, set peer_dns_names to a list of tasks.<service> names.
# - peerIP selects this task's local IPv4 address on the peer DNS subnet.
# - peerAddr returns that IP as host:port for endpoint-shaped advertise fields.
# For multi-overlay Swarm services, set peer_network_cidrs to the cache overlay
# subnet. DNS peer discovery and advertise_addr: auto will then use only that
# network instead of every IP returned by tasks.<service>.
# Bind addresses are listener addresses. Advertise addresses are what peers
# dial, so memberlist advertise_addr must resolve to this task's overlay IP.
common:
  cache:
    log:
      level: info
    size_bytes: 1_073_741_824
    api:
      bind_addr: "0.0.0.0"
      bind_port: 9090
    cluster:
      tls:
        enabled: false
      memberlist:
        node_name: '{{ env "CACHE_CLUSTER_MEMBERLIST_NODE_NAME" }}'
        bind_address: "0.0.0.0"
        bind_port: 8946
        # "auto" derives this task's peer-reachable gossip IP. With one
        # matching overlay it can use peer_dns_name; with multiple overlays,
        # set peer_network_cidrs so startup can choose the cache network.
        advertise_addr: auto
        peer_dns_name: "{{ peerDNSName }}"
        peer_dns_names: []
        peer_dns_port: 8946
        peer_network_cidrs: []
        replication_factor: 3
    peers:
      refresh_interval_ms: 30000
    churn:
      grace_period_ms: 30000
    diagnostics:
      min_ready_peers: 2
