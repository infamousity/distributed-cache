version: '3.9'

services:
  app:
    image: your-org/your-service:latest
    networks:
      - app_net
      - cache_control
    deploy:
      mode: replicated
      replicas: 3
    environment:
      # Your service should pass these through to cache.Start(Options{...}).
      # The cache data plane is in-process; peer coordination uses the gRPC control plane.
      CACHE_NODE_NAME: "{{.Task.Name}}"
      CACHE_CONTROL_BIND_ADDR: "0.0.0.0"
      CACHE_CONTROL_BIND_PORT: 9090
      CACHE_GOSSIP_BIND_ADDR: "0.0.0.0"
      CACHE_GOSSIP_BIND_PORT: 8946
      CACHE_SEED_NODES: tasks.app:8946
      CACHE_SHARED_KEY: change-me
      CACHE_TOMBSTONE_TTL_MS: 300000

networks:
  app_net:
    driver: overlay
  cache_control:
    driver: overlay
    attachable: false
    internal: true
    driver_opts:
      encrypted: "true"
